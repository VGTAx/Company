build:docker:
  stage: build
  image: docker:26.1.3
  tags:
    - docker
  # only:
  #   - tags
  # except:
  #   - branches1
  services:
    - name: docker:26.1.3-dind  
  
  variables:
    DOCKER_IMAGE_NAME: "$DOCKER_USER/company"
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin  

  script:
    - docker build -t "$DOCKER_IMAGE_NAME:latest" .
    - docker push "$DOCKER_IMAGE_NAME" --all-tags
